@if (title) {
  <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-fade-in-up">
    <div>
      <h2 class="font-display text-3xl font-bold text-primary tracking-tight">{{ title }}</h2>
      @if (subtitle) {
        <p class="text-base text-on-surface-variant mt-2 font-inter">{{ subtitle }}</p>
      }
    </div>
    @if (buttonLabel && buttonRoute) {
      <a mat-flat-button [routerLink]="buttonRoute" class="hb-btn-gradient !rounded-full !px-6 !py-6 text-base font-semibold tracking-wide">
        <mat-icon class="mr-2">{{ buttonIcon }}</mat-icon>
        {{ buttonLabel }}
      </a>
    }
  </div>
}

<div [ngClass]="noCard ? '' : 'hb-card-wrapper'">
  <ng-content></ng-content>
</div>
