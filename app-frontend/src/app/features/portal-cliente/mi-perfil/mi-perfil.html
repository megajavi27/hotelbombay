<div class="max-w-2xl mx-auto">
  <div class="mb-6">
    <h2 class="font-display text-3xl font-bold text-primary">Mi Perfil</h2>
    <p class="text-sm text-on-surface-variant mt-0.5">Actualiza tu información de contacto.</p>
  </div>

  @if (isLoading()) {
    <div class="py-16 flex justify-center">
      <mat-progress-spinner diameter="36" mode="indeterminate"></mat-progress-spinner>
    </div>
  } @else {
    <mat-card class="hb-card" appearance="outlined">
      <mat-card-content class="!p-8">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">

          <!-- Datos de cuenta (solo lectura) -->
          <h3 class="text-xs font-semibold uppercase tracking-wider text-secondary mb-3">Datos de cuenta</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
            <mat-form-field>
              <mat-label>Nombre</mat-label>
              <input matInput formControlName="nombre">
              <mat-hint>No editable — contacta recepción</mat-hint>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Apellido</mat-label>
              <input matInput formControlName="apellido">
            </mat-form-field>
            <mat-form-field class="md:col-span-2">
              <mat-label>Correo Electrónico</mat-label>
              <input matInput formControlName="email">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Tipo de Documento</mat-label>
              <input matInput formControlName="tipo_documento">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Número de Documento</mat-label>
              <input matInput formControlName="numero_documento">
            </mat-form-field>
          </div>

          <mat-divider class="!my-5"></mat-divider>

          <!-- Datos editables -->
          <h3 class="text-xs font-semibold uppercase tracking-wider text-secondary mb-3">Información de contacto</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
            <mat-form-field>
              <mat-label>Teléfono</mat-label>
              <input matInput formControlName="telefono" placeholder="+593 99 999 9999">
              <mat-icon matSuffix>phone</mat-icon>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Dirección</mat-label>
              <input matInput formControlName="direccion">
              <mat-icon matSuffix>home</mat-icon>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Nacionalidad</mat-label>
              <input matInput formControlName="nacionalidad">
              <mat-icon matSuffix>flag</mat-icon>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Fecha de Nacimiento</mat-label>
              <input matInput [matDatepicker]="pickerNac" formControlName="fecha_nacimiento">
              <mat-datepicker-toggle matIconSuffix [for]="pickerNac"></mat-datepicker-toggle>
              <mat-datepicker #pickerNac></mat-datepicker>
            </mat-form-field>
          </div>

          <mat-card-actions align="end" class="!px-0 !mt-2">
            <button mat-flat-button color="primary" type="submit" [disabled]="isSaving()">
              @if (isSaving()) {
                <mat-progress-spinner diameter="18" mode="indeterminate" class="inline-block mr-2"></mat-progress-spinner>
              } @else {
                <mat-icon>save</mat-icon>
              }
              Guardar Cambios
            </button>
          </mat-card-actions>
        </form>
      </mat-card-content>
    </mat-card>
  }
</div>
