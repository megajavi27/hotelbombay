<div class="max-w-2xl mx-auto">
  <div class="mb-6 flex items-center gap-2">
    <a mat-icon-button routerLink="/tipos-habitacion">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h2 class="font-display text-3xl font-bold text-primary">{{ isEditMode() ? 'Editar Tipo de Habitación' : 'Nuevo Tipo de Habitación' }}</h2>
  </div>

  <mat-card class="hb-card" appearance="outlined">
    <mat-card-content class="!p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
          <mat-form-field class="md:col-span-2">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="nombre" placeholder="Ej. Suite">
          </mat-form-field>
          <mat-form-field class="md:col-span-2">
            <mat-label>Descripción</mat-label>
            <textarea matInput formControlName="descripcion" rows="3"></textarea>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Precio por Noche (USD)</mat-label>
            <input matInput type="number" step="0.01" formControlName="precio_noche">
            <span matTextPrefix>$&nbsp;</span>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Capacidad Máxima</mat-label>
            <input matInput type="number" formControlName="capacidad_maxima">
          </mat-form-field>
          <mat-form-field class="md:col-span-2">
            <mat-label>Servicios incluidos</mat-label>
            <input matInput formControlName="servicios" placeholder="WiFi, TV, Minibar...">
          </mat-form-field>
          <mat-form-field class="md:col-span-2">
            <mat-label>URL de Imagen</mat-label>
            <input matInput formControlName="imagen_url" placeholder="https://...">
          </mat-form-field>
          <div class="flex items-center">
            <mat-checkbox formControlName="activo">Tipo Activo</mat-checkbox>
          </div>
        </div>

        <mat-card-actions align="end" class="!px-0">
          <a mat-button routerLink="/tipos-habitacion">Cancelar</a>
          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSaving()">
            Guardar
          </button>
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>
</div>
